[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-bench"
version = "0.1.0"
description = "Information and action efficiency under imperfect instructions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Xu Wan"}, {name = "Wenyue Xu"}, {name = "Shenjie Zhao"}]
dependencies = ["jsonschema>=4", "openpyxl>=3.1", "Pillow>=10", "numpy>=1.26", "pandas>=2.2"]

[project.optional-dependencies]
artifacts = ["pymupdf>=1.24", "pdfplumber>=0.11", "nbformat>=5.10", "scipy>=1.12", "statsmodels>=0.14", "shapely>=2", "python-docx>=1.1", "python-pptx>=1", "openai>=1", "httpx>=0.27", "pydantic>=2", "tabulate>=0.9", "mammoth>=1.8", "xlrd==2.0.2", "pyarrow>=15", "huggingface-hub>=0.24"]

[project.scripts]
ea-bench = "ea_bench.cli:main"

[tool.setuptools.packages.find]
include = ["ea_bench*", "integrations*"]
